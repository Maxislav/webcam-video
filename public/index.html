<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Camera Capture</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>Camera Capture</h1>

    <div class="field">
      <label for="snapshotPromptInput">Snapshot prompt (sent with each snapshot)</label>
      <textarea id="snapshotPromptInput" rows="3" maxlength="8000" placeholder="What should the model do with each snapshot?"></textarea>
    </div>

    <div class="field">
      <label for="deviceSelect">Video source</label>
      <select id="deviceSelect" disabled>
        <option>Loading devices…</option>
      </select>
    </div>

    <div class="stage">
      <div class="camera-container">
        <video id="video" autoplay playsinline muted></video>
        <div id="selection" class="selection" hidden></div>
        <div id="selectLayer" class="select-layer"></div>
        <div id="flash" class="flash"></div>
        <p id="placeholder" class="placeholder">Waiting for camera…</p>
      </div>
      <ul id="history" class="history" aria-label="Answers"></ul>
    </div>

    <div class="actions">
      <button id="snapshotBtn" type="button" disabled>Take Snapshot</button>
      <button id="selectBtn" type="button" class="secondary" disabled>Select area</button>
      <button id="resetBtn" type="button" class="secondary" hidden>Reset area</button>
      <span class="hint">or press <kbd>Space</kbd> / <kbd>Enter</kbd></span>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <form id="askForm" class="ask">
      <label for="askInput">Ask a question (drop or paste an image into the field to include it)</label>
      <textarea id="askInput" rows="3" placeholder="Type a question… (Enter to send, Shift+Enter for a new line)"></textarea>
      <label for="askPromptInput">Question prompt (appended to the end of your question on Send)</label>
      <textarea id="askPromptInput" rows="2" maxlength="8000" placeholder="Optional, e.g. “Answer briefly in Russian”"></textarea>
      <div id="attachment" class="attachment" hidden>
        <img id="attachmentPreview" alt="Attached image" />
        <button id="attachmentRemove" type="button" class="secondary">Remove image</button>
      </div>
      <div class="actions">
        <button id="askBtn" type="submit">Send</button>
      </div>
    </form>

    <canvas id="canvas" hidden></canvas>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
